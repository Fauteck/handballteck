# Handballteck als eigener Container. Für den Produktivbetrieb gehört diese
# Datei (angepasst) nach docker-configs; hier ist sie das Muster und der Weg
# für die lokale Entwicklung: `cp .env.example .env`, Werte eintragen,
# `docker compose up --build`.
services:
  handballteck:
    build: .
    image: handballteck:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ./data:/data
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
