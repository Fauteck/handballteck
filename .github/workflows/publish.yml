name: Publish Docker Image

# Der einzige Workflow dieses Repos, und er läuft ausschließlich von Hand
# (`workflow_dispatch`) — kein `push`, kein `pull_request`, kein Zeitplan.
# Dieselbe Regel wie in Todoteck: Ein Image entsteht nur, wenn es jemand
# auslöst, und nur nach grünem `quality`-Job. Weitere Prüfungen kommen als
# Schritt in diesen Job, nicht in eine zweite Workflow-Datei (CLAUDE.md).
#
# `gates_only = true` lässt nur die Prüfungen laufen, ohne zu veröffentlichen.
on:
  workflow_dispatch:
    inputs:
      gates_only:
        description: 'Nur Typecheck und Tests, kein Image bauen und pushen'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

concurrency:
  group: publish-image
  cancel-in-progress: false

# CIO-3-001: Standard nur Lesen; `build-and-push` hebt für sich `packages: write` an.
permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Test, Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Browser-Test der Einstellungsseite
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e

      # Nur Laufzeit-Abhängigkeiten und nur ab „high": Was im Image landet,
      # soll keine bekannte schwere Lücke tragen; Werkzeuge der Entwicklung
      # (vitest, esbuild) kommen nicht ins Image.
      - name: Dependency audit (runtime, high+)
        run: npm audit --omit=dev --audit-level=high

      # Ein zweiter, unabhängiger Blick: Trivy liest die Lockdatei gegen seine
      # eigene Schwachstellen-Datenbank (nicht nur die von npm) und sucht
      # nebenbei nach versehentlich eingecheckten Geheimnissen. Nur behebbare
      # Funde ab „high" brechen den Lauf ab.
      # Auf den Commit gepinnt, nicht auf den Tag: Tags einer Fremd-Action lassen
      # sich umhängen, und dieser Job teilt den GHA-Cache mit dem Image-Bau.
      - name: Trivy (Abhängigkeiten und Geheimnisse)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules

  build-and-push:
    name: Build and Push Image
    needs: quality
    if: ${{ !inputs.gates_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/handballteck
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # Commit-SHA und Bauzeitpunkt wandern als Build-Args ins Image und
      # erscheinen in /healthz und /api/health — und damit in der
      # Dienste-Zeile von Todoteck.
      - name: Versionsinfo berechnen
        id: version
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.version.outputs.sha_short }}
            BUILT_AT=${{ steps.version.outputs.built_at }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # Ergebnis-Meldung an Home Assistant.
  #
  # Kein Gate, sondern das Bindeglied der Release-Kette: Home Assistant
  # erfährt hier, ob der Dispatch durchgelaufen ist, und stößt danach den
  # Portainer-Redeploy an (script.portainer_deploy, Health-Polling über das
  # Image-Label). Portainer ist nur im LAN erreichbar, ein GitHub-Runner
  # kann es nicht aufrufen — deshalb endet der Repo-Anteil hier.
  #
  # Läuft per `if: always()` auch dann, wenn ein Job rot ist, sonst gäbe
  # es für den Fehlerpfad keine Meldung. `repository` in der Nutzlast ist
  # der Schlüssel, mit dem Home Assistant den Portainer-Stack auswählt.
  # Vorbild und Nutzlast-Vertrag: Repo Fauteck/todo, publish.yml (notify).
  notify:
    name: Ergebnis an Home Assistant melden
    needs:
      - quality
      - build-and-push
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Ergebnis zusammenfassen
        id: summary
        env:
          RESULT_GATE: ${{ needs.quality.result }}
          RESULT_BUILD: ${{ needs.build-and-push.result }}
          GATES_ONLY: ${{ inputs.gates_only }}
        run: |
          set -euo pipefail

          status=success
          failed=''
          images_published=false

          # Fällt das Gate aus, ist der Build nur „skipped" und darf nicht
          # als eigener Fehler gemeldet werden.
          if [ "$RESULT_GATE" != 'success' ]; then
            status=failure
            failed='quality'
          elif [ "$GATES_ONLY" = 'true' ]; then
            : # Gates-Only-Lauf: Image wurde bewusst nicht gebaut.
          elif [ "$RESULT_BUILD" != 'success' ]; then
            status=failure
            failed='build-and-push'
          else
            images_published=true
          fi

          # `gates_only` und `images_published` sind bewusst getrennt: ein
          # grüner Gates-Only-Lauf ist ein Erfolg, darf aber KEINEN Deploy
          # auslösen. Home Assistant prüft deshalb `images_published`.
          jq -n \
            --arg     status           "$status" \
            --argjson gates_only       "${GATES_ONLY:-false}" \
            --argjson images_published "$images_published" \
            --arg     failed_jobs      "$failed" \
            --arg     sha              "$GITHUB_SHA" \
            --arg     sha_short        "${GITHUB_SHA::7}" \
            --arg     ref              "$GITHUB_REF_NAME" \
            --arg     repository       "$GITHUB_REPOSITORY" \
            --arg     actor            "$GITHUB_ACTOR" \
            --arg     run_id           "$GITHUB_RUN_ID" \
            --arg     run_attempt      "$GITHUB_RUN_ATTEMPT" \
            --arg     run_url          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              status:           $status,
              gates_only:       $gates_only,
              images_published: $images_published,
              failed_jobs:      ($failed_jobs | split(",") | map(select(length > 0))),
              sha:              $sha,
              sha_short:        $sha_short,
              ref:              $ref,
              repository:       $repository,
              actor:            $actor,
              run_id:           $run_id,
              run_attempt:      $run_attempt,
              run_url:          $run_url
            }' > payload.json

          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo "### Meldung an Home Assistant"
            echo
            echo '```json'
            cat payload.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Schlägt die Zustellung fehl, wird dieser Job rot — der Build-Job
      # bleibt davon unberührt: Image ist veröffentlicht, nur die Kette steht.
      - name: Webhook an Home Assistant senden
        env:
          HA_WEBHOOK_URL: ${{ secrets.HA_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HA_WEBHOOK_URL:-}" ]; then
            echo "::notice::Secret HA_RELEASE_WEBHOOK_URL ist nicht gesetzt — die Meldung an Home Assistant wird übersprungen."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
               --retry 3 --retry-delay 5 --retry-connrefused \
               --connect-timeout 10 --max-time 30 \
               --request POST \
               --header 'Content-Type: application/json' \
               --data @payload.json \
               "$HA_WEBHOOK_URL"

          echo "::notice::Ergebnis (${{ steps.summary.outputs.status }}) an Home Assistant gemeldet."
